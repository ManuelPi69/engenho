{n:'Visão geral do engenho',sc:'Meso',w:'H',t:[20,3,-10],d:170,y:.35,p:.5,x:'Sou a guia desta trilha. Os engenhos eram latifúndios monocultores: grandes terras onde se plantava quase só cana-de-açúcar, para dar o máximo de rendimento e abastecer o mercado. Siga com “Próximo” ou troque a escala: Micro (senzala), Meso (engenho), Macro (rotas atlânticas).'},
{n:'1 · Casa-Grande e capela',sc:'Meso',w:'E',t:[-45,4,-8],d:48,y:.4,p:.25,x:'Sou o escrivão: faço a contabilidade e controlo os estoques; como trabalhador livre, recebo salário. Esta é a Casa-Grande, sede da fazenda e moradia do senhor de engenho e sua família. Na capela se rezavam as missas e, em geral, enterravam-se os mortos da família. Os chiqueiros e estábulos davam alimento e transporte.'},
{n:'2 · Senzala',sc:'Micro',w:'H',t:[-30,1.5,-38],d:17,y:.12,p:.15,x:'Escala micro: a senzala, moradia das pessoas escravizadas, africanas e seus descendentes. Observe os estrados, o fogo e o espaço reduzido. Todas as etapas da produção dependiam desse trabalho forçado. O par “casa-grande e senzala” é debatido pela historiografia: nem toda moradia era um alojamento coletivo.'},
{n:'3 · Canavial (etapa 1)',sc:'Meso',w:'E',t:[100,2,-30],d:60,y:.6,p:.35,x:'Aqui a cana era do tipo “crioula” e levava de 12 a 18 meses para ser colhida. Cortada à mão por pessoas escravizadas, precisava ser moída em até 24 horas, senão perdia o teor de açúcar. Por isso os carros de boi corriam até a moenda. O trabalho era vigiado por feitores, muitas vezes a cavalo e com violência.'},
{n:'4 · Moenda (etapa 2)',sc:'Meso',w:'C',t:[30,3,-28],d:75,y:.9,p:.3,x:'Sou o carpinteiro: cuido da manutenção das rodas da moenda. A roda d’água, movida pelo curso de água, gira os rolos que esmagam a cana e extraem o caldo. Onde faltava água, usava-se a tração animal: bois girando longas varas ligadas aos rolos (ao fundo). Dentro, engrenagens de madeira transmitem a força.'},
{n:'5 · Cozinha do açúcar (etapa 3)',sc:'Meso',w:'M',t:[52,3,-10],d:32,y:.6,p:.3,x:'Sou o mestre de açúcar: controlo a moagem e o cozimento. Aqui o caldo é cozido em grandes tachos de cobre, sobre fornalhas a lenha, até virar melado. A chaminé solta fumaça o dia todo, e o calor é intenso e perigoso para quem trabalha aqui.'},
{n:'6 · Purga e secagem (etapas 4 e 5)',sc:'Meso',w:'M',t:[10,3,26],d:34,y:.1,p:.2,x:'O melado é coado e despejado em formas de barro; o barro úmido sobre elas ajudava a clarear o açúcar. Depois o açúcar é retirado das formas, batido e seco ao sol (ao lado). Seco, o produto era encaixotado e levado aos portos (etapa 6).'},
{n:'7 · Rio e embarque',sc:'Meso',w:'B',gp:[14.6,78],gy:.5,t:[20,2,82],d:58,y:.5,p:.3,x:'Sou o barqueiro. A produção era escoada pelos rios até o porto; Salvador foi o mais importante do Atlântico Sul até o século XVIII. O açúcar, em caixas e barricas, descia em canoas e barcaças e eram embarcadas em navios rumo a diferentes regiões da Europa.'},
{n:'8 · Rotas atlânticas',sc:'Macro',w:'H',t:[400,31,0],d:80,y:0,p:.02,vy:22,x:'Escala macro: o açúcar do Nordeste seguia para Lisboa e, no domínio holandês (1630–1654), também para Amsterdã. No sentido contrário, navios traziam africanos escravizados, sobretudo da África Centro-Ocidental. O engenho era peça de um sistema atlântico.'},

const pts=new Map();let pd=0;const pinch=()=>{const a=[...pts.values()];return a.length<2?0:Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])};
